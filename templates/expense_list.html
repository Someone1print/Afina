{% extends 'base.html' %}
{% block content %}
<h2>Расходы</h2>

<a href="{% url 'expense_create' %}" class="btn btn-primary mb-3">Добавить расход</a>

<table class="table table-striped">
  <thead>
    <tr><th>Дата</th><th>Категория</th><th>Сумма</th><th>Комментарий</th><th>Действия</th></tr>
  </thead>
  <tbody>
  {% for e in items %}
    <tr>
      <td>{{ e.date }}</td>
      <td>{{ e.category.expenseName }}</td>
      <td>{{ e.amount }}</td>
      <td>{{ e.note }}</td>
      <td>
        <a href="{% url 'expense_update' e.id %}" class="btn btn-sm btn-warning">Изменить</a>
        <a href="{% url 'expense_delete' e.id %}" class="btn btn-sm btn-danger">Удалить</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="5">Нет данных</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
