{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h2>{{ title|default:"Добавить расход" }}</h2>

  <form method="post">
    {% csrf_token %}
    <div class="form-group mt-3">
      <label for="id_category">Категория</label>
      {{ form.category }}
    </div>

    <div class="form-group mt-3">
      <label for="id_date">Дата</label>
      {{ form.date }}
      {% if form.date.errors %}
        <div class="text-danger small">
          {{ form.date.errors }}
        </div>
      {% endif %}
    </div>

    <div class="form-group mt-3">
      <label for="id_amount">Сумма</label>
      {{ form.amount }}
    </div>

    <div class="form-group mt-3">
      <label for="id_note">Комментарий</label>
      {{ form.note }}
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-success">💾 Сохранить</button>
      <a href="{% url 'expense_list' %}" class="btn btn-secondary">↩ Назад</a>
    </div>
  </form>
</div>
{% endblock %}
