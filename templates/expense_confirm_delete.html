{% extends 'base.html' %}
{% block content %}
<header>
    <nav>
        <div class="logo">
            <a href="{% url 'home' %}" style="text-decoration: none; color: #223d77;">AFINA</a>
        </div>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}">Главная</a></li>
            <li><a href="{% url 'income_category_list' %}">Категории доходов</a></li>
            <li><a href="{% url 'expense_category_list' %}">Категории расходов</a></li>
            <li><a href="#">Копилка</a></li>
            <li><a href="#">Подписка</a></li>
            <li><a href="#">Статистика</a></li>
        </ul>
    </nav>
</header>

<h2>Удалить расход</h2>
<p>Вы уверены, что хотите удалить расход от <strong>{{ item.date }}</strong> на сумму {{ item.amount }}?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a href="{% url 'expense_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
