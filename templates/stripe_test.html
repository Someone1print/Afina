{% extends "base.html" %}
{% block content %}

<div class="stripe-test">
  <h1>Тест Stripe оплаты</h1>
  <p>Нажми кнопку, чтобы перейти на тестовую оплату Stripe.</p>

  <button id="checkout-button" class="btn btn-primary">
    Оплатить Подписку
  </button>

  <p style="margin-top: 10px; font-size: 14px; color: #6b7280;">
    Используй тестовую карту: <strong>4242 4242 4242 4242</strong>, любая дата в будущем, любой CVC.
  </p>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
  const stripe = Stripe("{{ stripe_publishable_key }}");

  const checkoutButton = document.getElementById("checkout-button");
  checkoutButton.addEventListener("click", function () {
    fetch("{% url 'create_checkout_session' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      // тело нам не нужно, цена зашита в Django
    })
    .then(function(response) {
      return response.json();
    })
    .then(function(session) {
      if (session.error) {
        alert("Ошибка: " + session.error);
        return;
      }
      return stripe.redirectToCheckout({ sessionId: session.id });
    })
    .then(function(result) {
      if (result && result.error) {
        alert(result.error.message);
      }
    })
    .catch(function(error) {
      console.error("Error:", error);
      alert("Что-то пошло не так. Смотри консоль браузера.");
    });
  });
</script>

{% endblock %}
