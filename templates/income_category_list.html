<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Категории доходов</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
        a.button, button { background: #2563eb; color: #fff; padding: 8px 12px; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; }
        a.button.secondary { background: #6b7280; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border-bottom: 1px solid #e5e7eb; padding: 10px; text-align: left; }
        th { color: #374151; }
        .actions a { margin-right: 8px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
<div class="topbar">
    <h1>Категории доходов</h1>
    <div>
        <a class="button" href="{% url 'income_category_create' %}">+ Добавить</a>
        <a class="button secondary" href="{% url 'home' %}">Домой</a>
    </div>
</div>

{% if categories %}
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th style="width: 220px;">Действия</th>
    </tr>
    </thead>
    <tbody>
    {% for c in categories %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.incomeName }}</td>
            <td class="actions">
                <a class="button" href="{% url 'income_category_update' c.id %}">Изменить</a>
                <a class="button secondary" href="{% url 'income_category_delete' c.id %}">Удалить</a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% else %}
<p>Категорий пока нет. <a href="{% url 'income_category_create' %}">Создайте первую</a>.</p>
{% endif %}
</body>
</html>
