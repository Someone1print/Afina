{% extends 'base.html' %}

{% block title %}Удаление дохода{% endblock %}

{% block content %}
<div class="modal-backdrop">
  <div class="modal-box">
    <div class="modal-icon">🗑️</div>
    <h2 class="modal-title text-danger">Подтверждение удаления</h2>
    <p class="modal-text">
      Вы уверены, что хотите удалить доход от <strong>{{ item.date }}</strong> на сумму <strong>{{ item.amount }}</strong>?
    </p>
    <div class="modal-buttons">
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
      </form>
      <a href="{% url 'income_list' %}" class="btn btn-secondary">Отмена</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
/* Фон */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1050;
  animation: fadeIn 0.3s ease forwards;
}

/* Окно */
.modal-box {
  background: #fff;
  width: 400px;
  max-width: 90%;
  height: 400px;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  animation: slideIn 0.3s ease forwards;
}

/* Иконка */
.modal-icon {
  font-size: 50px;
  margin-bottom: 15px;
}

/* Заголовок и текст */
.modal-title {
  margin: 10px 0;
  font-size: 24px;
  color: #e74c3c;
}

.modal-text {
  font-size: 16px;
  color: #333;
  margin: 0 0 30px;
}

/* Кнопки */
.modal-buttons {
  display: flex;
  gap: 15px;
}

.btn {
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  text-decoration: none;
  border: none;
}

.btn-danger {
  background-color: #e74c3c;
  color: #fff;
  transition: background 0.2s;
}

.btn-danger:hover {
  background-color: #c0392b;
}

.btn-secondary {
  background-color: #bdc3c7;
  color: #2c3e50;
  transition: background 0.2s;
}

.btn-secondary:hover {
  background-color: #95a5a6;
}

/* Отключаем скролл страницы */
body {
  overflow: hidden;
}

/* Анимации */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideIn {
  from { transform: translateY(-30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>
{% endblock %}
