{% extends 'base.html' %}
{% block content %}

<h2>Категории расходов</h2>

<a href="{% url 'expense_category_create' %}" class="btn btn-primary mb-3">Добавить категорию</a>

<table class="table table-striped">
  <thead>
    <tr><th>ID</th><th>Название</th><th>Действия</th></tr>
  </thead>
  <tbody>
  {% for c in categories %}
    <tr>
      <td>{{ c.id }}</td>
      <td>{{ c.expenseName }}</td>
      <td>
        <a href="{% url 'expense_category_update' c.id %}" class="btn btn-sm btn-warning">Изменить</a>
        <a href="{% url 'expense_category_delete' c.id %}" class="btn btn-sm btn-danger">Удалить</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="3">Нет категорий</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
