<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
        form { max-width: 420px; }
        label { display: block; margin: 12px 0 6px; color: #374151; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
        .actions { margin-top: 16px; display: flex; gap: 8px; }
        button, a.button { background: #2563eb; color: #fff; padding: 8px 12px; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; }
        a.button.secondary { background: #6b7280; }
    </style>
</head>
<body>
<h1>{{ title }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
        <button type="submit">Сохранить</button>
        <a class="button secondary" href="{% url 'income_category_list' %}">Отмена</a>
    </div>
</form>
</body>
</html>
