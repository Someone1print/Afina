{% extends 'base.html' %}
{% block content %}
<h2>Доходы</h2>

<a href="{% url 'income_create' %}" class="btn btn-primary mb-3">Добавить доход</a>

<table class="table table-striped">
  <thead>
    <tr><th>Дата</th><th>Категория</th><th>Сумма</th><th>Комментарий</th><th>Действия</th></tr>
  </thead>
  <tbody>
  {% for i in items %}
    <tr>
      <td>{{ i.date }}</td>
      <td>{{ i.category.incomeName }}</td>
      <td>{{ i.amount }}</td>
      <td>{{ i.note }}</td>
      <td>
        <a href="{% url 'income_update' i.id %}" class="btn btn-sm btn-warning">Изменить</a>
        <a href="{% url 'income_delete' i.id %}" class="btn btn-sm btn-danger">Удалить</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="5">Нет данных</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
