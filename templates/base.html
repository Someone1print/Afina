<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ваш финансовый помощник</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<nav>
  <ul>
    <li><a href="{% url 'expense_category_list' %}">Категории расходов</a></li>
    <li><a href="{% url 'income_list' %}">Доходы</a></li>
    <li><a href="{% url 'expense_list' %}">Расходы</a></li>
    <li><a href="{% url 'profile_view' %}">Профиль</a></li>
    <li><a href="{% url 'logout' %}">Выйти</a></li>
  </ul>
</nav>
<body class="container mt-4">
  {% if user.is_authenticated %}
    <p class="text-end">Вы вошли как {{ user.username }} |
       <a href="{% url 'logout' %}">Выйти</a></p>
  {% endif %}
  {% if messages %}
  <div class="alert alert-info">
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}


  {% block content %}{% endblock %}
</body>
</html>
